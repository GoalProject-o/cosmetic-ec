name: 🔄 Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-type-check:
    name: 🔍 Lint and Type Check
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 🔧 Install dependencies
      run: npm ci
      
    - name: 🎯 TypeScript type check
      run: npm run type-check
      continue-on-error: false
      
    - name: ✨ ESLint check
      run: npm run lint
      continue-on-error: true
      
  build-test:
    name: 🏗️ Build Test
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 🔧 Install dependencies
      run: npm ci
      
    - name: 🏗️ Build application
      run: npm run build
      env:
        NODE_ENV: production
        
    - name: 📊 Build size analysis
      run: |
        echo "## 📊 Build Size Report" >> $GITHUB_STEP_SUMMARY
        echo "Build completed successfully ✅" >> $GITHUB_STEP_SUMMARY
        
  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔍 Run npm audit
      run: |
        npm audit --audit-level moderate
        echo "## 🛡️ Security Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "Security scan completed" >> $GITHUB_STEP_SUMMARY
      continue-on-error: true
      
  performance-check:
    name: ⚡ Performance Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 🔧 Install dependencies
      run: npm ci
      
    - name: 🏗️ Build for performance test
      run: npm run build
      
    - name: ⚡ Bundle size check
      run: |
        echo "## ⚡ Performance Report" >> $GITHUB_STEP_SUMMARY
        echo "Bundle analysis completed" >> $GITHUB_STEP_SUMMARY
        
  notification:
    name: 📢 Notification
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, build-test, security-scan]
    if: always()
    
    steps:
    - name: 📢 CI Results Summary
      run: |
        echo "## 🎯 CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|---------|" >> $GITHUB_STEP_SUMMARY
        echo "| Lint & Type Check | ${{ needs.lint-and-type-check.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Build Test | ${{ needs.build-test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY